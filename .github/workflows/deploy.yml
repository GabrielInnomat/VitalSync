name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/build.yml

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          AFTER: ${{ github.sha }}
        run: |
          deploy=true
          if [ "$EVENT_NAME" = "push" ]; then
            deployed=""
            deployments="$(gh api "repos/${REPOSITORY}/deployments?environment=production&per_page=100" --jq '.[] | "\(.id) \(.sha)"' || true)"
            while read -r id sha; do
              if [ -z "$id" ]; then
                continue
              fi
              state="$(gh api "repos/${REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // ""' || true)"
              if [ "$state" = "success" ]; then
                deployed="$sha"
                break
              fi
            done <<< "$deployments"
            echo "Last successful deployment: ${deployed:-none}"
            if [ -n "$deployed" ] && git cat-file -e "${deployed}^{commit}" 2> /dev/null; then
              changed="$(git diff --name-only "$deployed" "$AFTER")"
              if ! grep -qv '\.md$' <<< "$changed"; then
                deploy=false
              fi
            fi
          fi
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          echo "Deploy: ${deploy}"

  deploy:
    needs: [ci, changes]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: [self-hosted, windows, vitalsync]
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v7

      - name: Create the volumes
        run: .\tools\hosting\New-VitalSyncVolumes.ps1

      - name: Deploy
        run: aspire deploy --non-interactive --nologo

      - name: Check the health endpoints
        run: |
          Import-Module .\tools\hosting\VitalSyncHosting.psm1
          $network = "$(Resolve-ComposeProject)_aspire"
          foreach ($service in 'web-frontend', 'backend-for-frontend', 'nutrition-service', 'fitness-service', 'health-analytics-service') {
            $healthy = $false
            for ($attempt = 1; $attempt -le 24 -and -not $healthy; $attempt++) {
              $answer = (Invoke-Docker -Arguments @('run', '--rm', '--network', $network, 'curlimages/curl:8.17.0', '-sS', '--max-time', '3', "http://${service}:8081/health") -AllowFailure).Output.Trim()
              if ($answer.EndsWith('Healthy')) {
                $healthy = $true
              } else {
                Start-Sleep -Seconds 5
              }
            }
            if (-not $healthy) {
              throw "$service did not answer Healthy."
            }
            Write-Output "$service is healthy."
          }

      - name: Remove unused images
        run: |
          Import-Module .\tools\hosting\VitalSyncHosting.psm1
          $prune = Invoke-Docker -Arguments @('image', 'prune', '--all', '--force') -AllowFailure
          if ($prune.ExitCode -eq 0) {
            Write-Output (($prune.Output -split [Environment]::NewLine) | Where-Object { $_ -like 'Total reclaimed space*' })
          } else {
            Write-Warning "docker image prune failed with exit code $($prune.ExitCode)."
          }