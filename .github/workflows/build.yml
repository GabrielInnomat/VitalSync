name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        env:
          GAWECODES_REQUIRE_CONTAINERS: "1"
        run: dotnet test --configuration Release --no-build -- --output Detailed --report-xunit-trx

      - name: Failed test detail
        if: failure()
        run: |
          found=0
          while IFS= read -r trx; do
            if grep -q 'outcome="Failed"' "$trx"; then
              found=1
              echo "::group::$trx"
              sed -n '/outcome="Failed"/,/<\/UnitTestResult>/p' "$trx"
              echo "::endgroup::"
            fi
          done < <(find . -name '*.trx' -type f)
          if [ "$found" -eq 0 ]; then
            echo "No TRX report contained a failed test - the failure came from outside the test run."
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/bin/Release/net10.0/TestResults/**"
          if-no-files-found: ignore

      - name: Create the ASP.NET development certificate
        run: dotnet dev-certs https

      - name: Start the samples AppHost
        env:
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        run: |
          nohup dotnet run --project samples/VitalSync.Samples.AppHost \
            --configuration Release --no-build > apphost.log 2>&1 &
          echo $! > apphost.pid

      - name: Wait for both sample APIs
        run: |
          for attempt in $(seq 1 100); do
            if curl -sk --max-time 3 https://localhost:54230/health > /dev/null \
              && curl -sk --max-time 3 https://localhost:54240/health > /dev/null; then
              echo "Both sample APIs are up after ${attempt} attempts."
              exit 0
            fi
            if [ $((attempt % 6)) -eq 0 ]; then
              echo "Still waiting after ${attempt} attempts. Containers:"
              docker ps --all --format '  {{.Names}} | {{.Image}} | {{.Status}}' || true
            fi
            sleep 5
          done
          echo "The sample APIs did not become reachable."
          exit 1

      - name: Smoke tests
        env:
          SAMPLE_STATESTORED_API_URL: https://localhost:54230
          SAMPLE_EVENTSOURCED_API_URL: https://localhost:54240
          VITALSYNC_REQUIRE_SMOKE: "1"
          GAWECODES_REQUIRE_CONTAINERS: "1"
        run: |
          dotnet test samples/StateStored/VitalSync.Sample.StateStored.Tests \
            --configuration Release --no-build -- --output Detailed --report-xunit-trx
          dotnet test samples/EventSourced/VitalSync.Sample.EventSourced.Tests \
            --configuration Release --no-build -- --output Detailed --report-xunit-trx

      - name: Failed smoke test detail
        if: failure()
        run: |
          while IFS= read -r trx; do
            if grep -q 'outcome="Failed"' "$trx"; then
              echo "::group::$trx"
              sed -n '/outcome="Failed"/,/<\/UnitTestResult>/p' "$trx"
              echo "::endgroup::"
            fi
          done < <(find samples -name '*.trx' -type f)

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: "samples/**/bin/Release/net10.0/TestResults/**"
          if-no-files-found: ignore

      - name: Diagnostics
        if: failure()
        run: |
          echo "=== apphost.log ==="
          if [ -f apphost.log ]; then
            cat apphost.log
          else
            echo "apphost.log not found — the AppHost was never started (an earlier step failed)."
          fi
          echo "=== docker ps --all ==="
          docker ps --all || true
          echo "=== docker images ==="
          docker images || true
          for container in $(docker ps --all --quiet 2> /dev/null); do
            echo "=== docker logs $(docker inspect --format '{{.Name}} {{.Config.Image}} {{.State.Status}}' "${container}" 2> /dev/null) ==="
            docker logs --tail 200 "${container}" 2>&1 || true
          done

      - name: Stop the samples AppHost
        if: always()
        run: kill "$(cat apphost.pid)" 2> /dev/null || true
